name: AI Media Copilot R3 one-shot free Chromium QA
on:
  push:
    branches:
      - feat/media-copilot-pr4-reconciled-20261020
    paths:
      - .github/workflows/media-copilot-qa.yml

permissions:
  contents: read

concurrency:
  group: ai-media-copilot-pr4-r3-once
  cancel-in-progress: false

jobs:
  qa:
    if: github.repository == 'zxcv037614/free-website-starter-guide' && github.ref == 'refs/heads/feat/media-copilot-pr4-reconciled-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NO_EXTERNAL_MUTATION: '1'
      CI: 'true'
    steps:
      - name: Check out actual GitHub branch read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Exact three source blobs links and SEO preflight
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import posixpath, subprocess, xml.etree.ElementTree as ET, os
          base="022f29eb09eb0899d8dbb5e2397f9eca0b3ff81b"
          slug="articles/github-copilot-model-retirement-2026-10.html"
          yaml=".github/workflows/media-copilot-qa.yml"
          blobs={
              slug:"0da3cf27a0c4106ba154e64b22bb1bec353df85e",
              "index.html":"1b867386fecc42edef9ef8f8327620801cd81d49",
              "sitemap.xml":"8789b2d729ade1320ccb06bde0350d1dbee53aaa"}
          assert os.environ.get("NO_EXTERNAL_MUTATION")=="1"
          assert os.environ.get("GITHUB_REF")=="refs/heads/feat/media-copilot-pr4-reconciled-20261020"
          assert subprocess.check_output(["git","rev-parse","origin/main"],text=True).strip()==base,"FAIL_CLOSED_MAIN_MOVED"
          actual=set(subprocess.check_output(["git","diff","--name-only",base+"...HEAD"],text=True).splitlines())
          assert actual==set(blobs)|{yaml},f"FAIL_CLOSED_EXTRA_PATHS {sorted(actual)}"
          for path,sha in blobs.items():
              assert subprocess.check_output(["git","hash-object",path],text=True).strip()==sha,f"BLOB_MISMATCH: {path}"
          assert subprocess.check_output(["git","hash-object","guide.html"],text=True).strip()=="81a683618169637938892549ec8492f07e2c522e"
          assert subprocess.check_output(["git","hash-object","tools/index.html"],text=True).strip()=="5f0789ec89116dfa2f515c52b236d04b51fa57e3"
          class Parsed(HTMLParser):
              def __init__(self):
                  super().__init__(); self.local=[]; self.h1=0; self.titles=0; self.meta=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="h1":self.h1+=1
                  if tag=="title":self.titles+=1
                  if tag=="meta":self.meta.append(a)
                  if tag in ("a","link","img","script"):
                      url=a.get("href",a.get("src",""))
                      if url:self.local.append(url)
          for path in (slug,"index.html"):
              raw=Path(path).read_text(encoding="utf-8")
              h=Parsed();h.feed(raw)
              assert h.h1==1 and h.titles==1,f"SEO_H1_TITLE {path}"
              assert any(x.get("name")=="viewport" for x in h.meta),f"VIEWPORT {path}"
              assert any(x.get("name")=="description" and len(x.get("content",""))>=40 for x in h.meta),f"DESCRIPTION {path}"
              for href in h.local:
                  u=urlsplit(href)
                  if u.scheme or href.startswith("#") or href.startswith("//"):continue
                  if not u.path:continue
                  is_dir=u.path.endswith("/")
                  target=posixpath.normpath(posixpath.join(posixpath.dirname(path),u.path))
                  if is_dir or target==".":
                      target=posixpath.join(target,"index.html")
                  assert Path(target).is_file(),f"BROKEN_LOCAL_LINK {path} -> {href} resolved={target}"
          article=Path(slug).read_text(encoding="utf-8")
          home=Path("index.html").read_text(encoding="utf-8")
          sitemap=Path("sitemap.xml").read_text(encoding="utf-8")
          pairs=[
              ("Gemini 3.7 Flash","Gemini 3.8 Flash"),
              ("GPT-5.5","GPT-6.1 Sol"),("GPT-5.4","GPT-6.1 Sol"),
              ("GPT-5.4 mini","GPT-6 Luna"),("GPT-5 mini","GPT-6 Luna"),
              ("Grok 4.5","Grok 4.7")]
          assert all("<td>"+a+"</td><td>"+b+"</td>" in article for a,b in pairs),"OCT19_MODELS_INVALID"
          assert "GPT-5.6 Sol" not in article and "GPT-5.6 Luna" not in article
          assert "<td>Grok 4.6</td>" not in article
          assert "2026-10-19-github-copilot-models-deprecated-on-october-19-2026/" in article
          assert "2026-09-18-upcoming-deprecation-of-selected-github-copilot-models-in-mid-october/" in article
          assert "與 Phantom AI 有關聯" in article and "非實測" in article
          assert "沒有使用六款模型逐一登入實測" in article
          assert "choose-ai-tool.html" in article
          assert '<link rel="canonical" href="https://zxcv037614.github.io/free-website-starter-guide/'+slug+'">' in article
          assert home.count('class="article-card"')==6
          assert home.count('href="'+slug+'"')==2
          assert "先看免費建站 3 步教學（含聯盟推薦） ↗" in home,"PR4_CTA_LOST"
          assert "依 GitHub 10/19 正式退役公告" in home
          root=ET.fromstring(sitemap)
          urls=[n.text for n in root.iter() if n.tag.endswith("loc")]
          assert len(urls)==10 and len(set(urls))==10
          assert urls.count("https://zxcv037614.github.io/free-website-starter-guide/"+slug)==1
          prior=ET.fromstring(subprocess.check_output(["git","show",base+":sitemap.xml"],text=True))
          old=[n.text for n in prior.iter() if n.tag.endswith("loc")]
          assert len(old)==9 and urls[:9]==old,"SITEMAP_OLD_LINKS_MODIFIED"
          print("STATIC_QA_PASS exact GitHub three blobs, PR4 referral preserved, trailing slash directories resolved, 10 unique urls, source and metadata")
          PY

      - name: Set up Python standard GitHub-hosted runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Actual mobile and desktop Chromium on checked-out source
        shell: bash
        run: |
          mkdir -p qa-evidence
          python -m http.server 8765 --bind 127.0.0.1 > qa-evidence/server.log 2>&1 &
          sleep 2
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json,subprocess
          server="http://127.0.0.1:8765/"
          slug="articles/github-copilot-model-retirement-2026-10.html"
          p=Path("qa-evidence");p.mkdir(exist_ok=True)
          checked=["index.html",slug,"sitemap.xml"]
          manifest={"namespace":"AI_MEDIA_COPILOT_R3","public_release":False,"screenshots":[],
                    "git_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                    "blobs":{path:subprocess.check_output(["git","hash-object",path],text=True).strip() for path in checked},
                    "checks":[]}
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              manifest["chromium_version"]=browser.version
              for device,width,height in [("mobile-375",375,812),("desktop-1440",1440,900)]:
                  ctx=browser.new_context(viewport={"width":width,"height":height},device_scale_factor=1)
                  for name,route in (("article",slug),("home","index.html")):
                      page=ctx.new_page()
                      def block_external(request):
                          if request.request.url.startswith(server):request.continue_()
                          else:request.abort()
                      page.route("**/*",block_external)
                      response=page.goto(server+route,wait_until="load",timeout=30000)
                      assert response is not None and response.status==200,f"LOCAL_HTTP {device} {route}"
                      page.locator("main").wait_for(state="visible")
                      assert page.locator("h1").count()==1,f"DOM_H1 {device} {name}"
                      dim=page.evaluate("({client:document.documentElement.clientWidth, scroll:document.documentElement.scrollWidth})")
                      assert dim["scroll"]<=dim["client"]+2,f"OVERFLOW {device} {name} {dim}"
                      if name=="article":
                          body=page.locator("main").inner_text()
                          assert all(x in body for x in ["GPT-6.1 Sol","GPT-6 Luna","Grok 4.7","Gemini 3.8 Flash"]),name
                          assert page.locator("table").count()==1
                          assert page.locator('a[href*="2026-10-19-github-copilot-models-deprecated"]').count()==1
                          assert page.locator('a[href*="choose-ai-tool.html"]').count()==1
                      else:
                          assert page.locator('a[href="'+slug+'"]').count()==2
                          assert page.get_by_text("先看免費建站 3 步教學（含聯盟推薦）").count()>=1
                      if device=="mobile-375":
                          toggle=page.locator("#menuBtn" if name=="article" else "#navToggle")
                          assert toggle.is_visible(),f"MENU_MISSING {device} {name}"
                          toggle.click()
                          assert toggle.get_attribute("aria-expanded")=="true",f"MENU_FAIL {device} {name}"
                      filename=f"{device}-{name}.png"
                      page.screenshot(path=str(p/filename),full_page=True)
                      manifest["screenshots"].append(filename)
                      manifest["checks"].append({"device":device,"route":route,"http":200,
                                                 "no_overflow":True,"h1":1,"menu_tested":device=="mobile-375","screenshot":filename})
                      page.close()
                  ctx.close()
              browser.close()
          assert len(manifest["screenshots"])==4
          (p/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BROWSER_QA_PASS exact branch files 375px mobile and 1440px desktop, 4 screenshots, no overflow")
          print("QA_MANIFEST "+json.dumps(manifest,ensure_ascii=False))
          PY

      - name: Upload one-day evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-media-copilot-r3-qa
          path: qa-evidence/
          retention-days: 1
          if-no-files-found: warn
