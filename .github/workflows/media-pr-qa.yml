name: AI Media PR1 isolated free QA
on:
  push:
    branches:
      - feat/media-systeme-seo-20261019
    paths:
      - .github/workflows/media-pr-qa.yml

permissions:
  contents: read

concurrency:
  group: ai-media-pr1-isolated-qa
  cancel-in-progress: true

jobs:
  qa:
    if: github.repository == 'zxcv037614/free-website-starter-guide' && github.ref == 'refs/heads/feat/media-systeme-seo-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NO_EXTERNAL_MUTATION: '1'
      CI: 'true'
    steps:
      - name: Checkout read-only isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce exact five-file scope and verify HTML SEO links
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import posixpath, subprocess, xml.etree.ElementTree as ET
          slug="articles/systeme-io-free-plan-selling-limits-2026.html"
          expected={slug,"index.html","guide.html","sitemap.xml",".github/workflows/media-pr-qa.yml"}
          actual=set(subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines())
          assert actual==expected,f"FAIL_CLOSED scope: {sorted(actual)}"
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag in ("a","link","img","script"):
                      u=d.get("href",d.get("src",""))
                      if u:self.urls.append(u)
          for page in ("index.html","guide.html",slug):
              html=Path(page).read_text(encoding="utf-8")
              assert html.count("<h1")==1 and 'name="viewport"' in html and 'lang="zh-Hant"' in html,page
              links=Links(); links.feed(html)
              for href in links.urls:
                  u=urlsplit(href)
                  if u.scheme or href.startswith("#") or href.startswith("//"):continue
                  target=posixpath.normpath(posixpath.join(posixpath.dirname(page),u.path))
                  if target==".":target="index.html"
                  elif target.endswith("/"):target+="index.html"
                  assert Path(target).is_file(),f"BROKEN_LOCAL_LINK {page} -> {href}"
          article=Path(slug).read_text(encoding="utf-8")
          index=Path("index.html").read_text(encoding="utf-8")
          guide=Path("guide.html").read_text(encoding="utf-8")
          xml=Path("sitemap.xml").read_text(encoding="utf-8")
          assert "US$10,000" in article and "US$8,000" in article
          assert "Phantom AI" in article and "利益揭露" in article and "非親自開店實測" in article
          assert 'href="../guide.html"' in article and "https://systeme.io/pricing" in article
          assert index.count('href="'+slug+'"')==2
          assert guide.count('href="./'+slug+'"')==1
          assert guide.count("sa02841839374da646696817e16d2487e5491a3702")==1
          urls=[n.text for n in ET.fromstring(xml).iter() if n.tag.endswith("loc")]
          assert urls.count("https://zxcv037614.github.io/free-website-starter-guide/"+slug)==1
          print("STATIC_QA_PASS exact five files, SEO, link targets, sitemap, disclosures, affiliate original")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install isolated Chromium browser
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Capture mobile and desktop page screenshots
        shell: bash
        run: |
          mkdir -p qa-evidence
          python -m http.server 8765 --bind 127.0.0.1 > qa-evidence/server.log 2>&1 &
          sleep 2
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          folder=Path("qa-evidence"); folder.mkdir(exist_ok=True)
          pages=[("article","articles/systeme-io-free-plan-selling-limits-2026.html"),("home","index.html"),("guide","guide.html")]
          manifest={"branch":"feat/media-systeme-seo-20261019","public_deployment":False,"screenshots":[],"checks":[]}
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              manifest["browser_version"]=browser.version
              for device,width,height in [("mobile-375",375,812),("desktop-1440",1440,900)]:
                  ctx=browser.new_context(viewport={"width":width,"height":height},device_scale_factor=1)
                  for name,route in pages:
                      page=ctx.new_page()
                      def allow_only_local(req):
                          if req.request.url.startswith("http://127.0.0.1:8765/"): req.continue_()
                          else: req.abort()
                      page.route("**/*",allow_only_local)
                      response=page.goto("http://127.0.0.1:8765/"+route,wait_until="load",timeout=30000)
                      assert response is not None and response.status==200,f"PAGE_HTTP_FAIL: {device}:{route}"
                      page.locator("main").wait_for(state="visible")
                      filename=f"{device}-{name}.png"
                      page.screenshot(path=str(folder/filename),full_page=True)
                      assert page.locator("h1").count()==1
                      scroll=page.evaluate("document.documentElement.scrollWidth")
                      client=page.evaluate("document.documentElement.clientWidth")
                      assert scroll<=client+2,f"HORIZONTAL_OVERFLOW {device} {name} {scroll} > {client}"
                      if name=="article":
                          assert page.locator('a[href="../guide.html"]').count()>=1
                          assert "US$10,000" in page.locator("main").inner_text()
                      if name=="home":
                          assert page.locator('a[href="articles/systeme-io-free-plan-selling-limits-2026.html"]').count()==2
                      if name in ("article","home") and device=="mobile-375":
                          toggle=page.locator("#navToggle")
                          assert toggle.is_visible()
                          toggle.click()
                          assert toggle.get_attribute("aria-expanded")=="true"
                      manifest["screenshots"].append(filename)
                      manifest["checks"].append({"page":name,"device":device,"http":200,"no_horizontal_overflow":True,"screenshot":filename,"pass":True})
                      page.close()
                  ctx.close()
              browser.close()
          (folder/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          assert len(manifest["screenshots"])==6
          print("BROWSER_QA_PASS mobile 375px and desktop 1440px, six screenshots, zero overflow")
          print(json.dumps({"browser":manifest["browser_version"],"screenshots":manifest["screenshots"]},ensure_ascii=False))
          PY

      - name: Preserve short-lived QA screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-media-pr1-qa-screenshots
          path: qa-evidence/
          retention-days: 1
          if-no-files-found: warn
